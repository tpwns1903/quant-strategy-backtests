import pandas as pd
import numpy as np
import matplotlib.pyplot as plt

# 1. 20일, 60일 이동평균 생성
df['MA20'] = df['종가'].rolling(window=20).mean()
df['MA60'] = df['종가'].rolling(window=60).mean()

# 2. 20일 > 60일 → 포지션 1, 아니면 0
df['포지션'] = np.where(df['MA20'] > df['MA60'], 1, 0)

# 3. 반드시 shift(1) 적용 (미래 데이터 방지)
df['실제포지션'] = df['포지션'].shift(1)

# 5. 전략 수익률 = 포지션 * 수익률
df['전략수익률'] = df['실제포지션'] * df['수익률']

# 6. 누적 수익률 계산
df['단순보유_누적수익률'] = (1 + df['수익률']).cumprod()
df['전략_누적수익률'] = (1 + df['전략수익률']).cumprod()

# 7. matplotlib으로 전략 vs 단순 보유 비교 그래프 출력
plt.figure(figsize=(10, 6))
plt.plot(df.index, df['단순보유_누적수익률'], label='Buy & Hold Returns')
plt.plot(df.index, df['전략_누적수익률'], label='Strategy Returns')
plt.title('Moving Average Backtest (20 vs 60)')
plt.xlabel('Date')
plt.ylabel('Cumulative Return')
plt.legend()
plt.grid(True)
plt.show()
